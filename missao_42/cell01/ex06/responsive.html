<head>
    
    <title>responsive.html</title>
    <style>
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            box-sizing: border-box;
        }

        
        *, *:before, *:after {
            box-sizing: inherit;
        }

        
        table {
            borde r-collapse: collapse;
            width: 100vw;  
            height: 100vh; 
        }

        
        td {
            border: 1px solid #000000;
            padding-left: 2vw; 
            vertical-align: middle;
            font-size: clamp(1.2rem, 5vw, 3.5rem);
            word-break: break-word; 
            font-family: Arial, sans-serif;
            width: 50%; 
        }

        
        .celula-verde {
            background-color: #a3df00;
        }

        .celula-rosa {
            background-color: #d12fb6;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="celula-verde">Cosmo</td>
            <td class="celula-rosa"> Wanda</td>
        </tr>
    </table>


</body>
</html>
