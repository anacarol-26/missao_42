<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Perfil</title>
    
    <link rel="stylesheet" href="card.css">
</head>
<body>

    
    <div class="card">
        
       
        <h1 class="card-title">Meu Cartão</h1>

        
        <table class="tabela-invisivel">
            <tr>
                <td>
                    
                    <img src="imagem1.jpeg" alt="Foto de Perfil" class="foto-perfil">
                </td>
            </tr>
            <tr>
                <td>
                    
                    <p class="login-usuario">ancaro10</p>
                </td>
            </tr>
            <tr>
                <td>
                    
                    <p class="descricao-curta">Futura Desenvolvedora</p>
                </td>
            </tr>
            <tr>
                <td>
                    
                    <div class="redes-sociais">
                        <a href="#"><img src="instagram.png" alt="Instagram" class="icone-social"></a>
                        <a href="#"><img src="whatsapp.png" alt="WhatsApp" class="icone-social"></a>
                        <a href="#"><img src="tik-tok.png" alt="Tik Tok" class="icone-social"></a>
                        <a href="#"><img src="linkedin.png" alt="LinkedIn" class="icone-social"></a>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                   
                    <button class="botao-contato">Contact</button>
                </td>
            </tr>
        </table>

    </div>

</body>
</html>
